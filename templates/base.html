<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spend Wise{% endblock %}</title>
    <meta name="application-name" content="Spend Wise">
    <meta name="description" content="Spend Wise helps you track expenses, understand your spending, and plan your monthly budget.">
    <meta name="theme-color" content="#122438">
    <meta property="og:site_name" content="Spend Wise">
    <meta property="og:title" content="Spend Wise — See your spending. Plan your month.">
    <meta property="og:description" content="Track expenses, understand your spending, and plan your monthly budget with Spend Wise.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/spend-wise-favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="{{ url_for('landing') }}" class="nav-brand">
                <img class="brand-logo" src="{{ url_for('static', filename='images/spend-wise-logo.svg') }}" width="194" height="40" alt="Spend Wise">
            </a>
            <div class="nav-links">
                <a href="{{ url_for('login') }}">Sign in</a>
                <a href="{{ url_for('register') }}" class="nav-cta">Get started</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <img class="brand-logo" src="{{ url_for('static', filename='images/spend-wise-logo.svg') }}" width="194" height="40" alt="Spend Wise">
            <p class="footer-copy">See your spending. Plan your month.</p>
            <a href="{{ url_for('terms') }}">Terms and Conditions</a>
            <a href="#">Privacy Policy</a>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
